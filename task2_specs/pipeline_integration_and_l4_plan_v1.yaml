version: '1.0'
scope: single_frame_only
existing_provider: modal
model: Qwen/Qwen3-VL-8B-Instruct-FP8
gpu: NVIDIA L4 24GB
implementation_policy:
  task_2: NO live inference configuration changes; keep current model, prompts, generation
    parameters, UI, routes, DB, TTS unchanged
  task_3: Benchmark changes behind configuration switches with rollback; apply only
    after verifying accuracy, token fit and latency
  single_frame_only: true
  no_animation_or_before_after: true
ownership:
  backend:
  - schema_version
  - frame_id
  - timestamp_seconds
  - provenance
  - raw_category_labels_from_task1
  - classifier_metadata
  - stable_ids
  - structural_validation
  - diagnostics
  qwen3_observation:
  - global_layout
  - visible_regions
  - visible_elements
  - visible_labels_and_exact_symbols
  - visible_relations
  - structural_overview
  - reading_order_proposal
  - explicit_uncertainties
  assembler:
  - canonical_category_mapping_without_guessing
  - normalize_supported_observations
  - attach_source_references
  - detect_truncation_and_errors
  not_for_qwen3:
  - timestamp_guessing
  - backend_generated_ids
  - final_explanation
  - transcript_gap_decisions
  - temporal_state_inference
performance_experiments_task_3:
  baseline_first: true
  current_snapshot_output_tokens: 384
  model_context_reported: 4096
  client_output_cap_reported: 2048
  candidate_max_output_tokens:
  - 512
  - 768
  - 1024
  - 1536
  2048_only_if_context_fits: true
  max_concurrent_sequences: 1
  region_crops: only for benchmarked difficult cases
  always_measure:
  - visual_input_tokens
  - text_prompt_tokens
  - output_tokens
  - latency_seconds
  - truncation_rate
  - extraction_quality
  - GPU_memory
compatibility:
- preserve_original_snapshot
- preserve_current_snapshot_engine_response
- preserve_existing_synchronizer_behavior
- preserve_existing_SQLite_records
- additive_only
