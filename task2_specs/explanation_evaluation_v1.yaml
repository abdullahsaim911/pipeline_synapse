rubric_id: SYNAPSE-EXPLANATION-EVAL
version: 1.0.0
status: proposed
annotation_requirements:
- ground truth from original frame and transcript
- annotator records each essential element and spatial/structural/cross-category relation
- record uncertain/unreadable values
- source video separation for train/test; do not reuse repeated frames across sets
review_fields:
- metric: essential fact recall
  evaluation: Compare against independently annotated source evidence; preserve per-category
    error analysis
- metric: grounded claim precision
  evaluation: Compare against independently annotated source evidence; preserve per-category
    error analysis
- metric: critical error rate
  evaluation: Compare against independently annotated source evidence; preserve per-category
    error analysis
- metric: spatial relationship correctness
  evaluation: Compare against independently annotated source evidence; preserve per-category
    error analysis
- metric: structural relation correctness
  evaluation: Compare against independently annotated source evidence; preserve per-category
    error analysis
- metric: cross-category relation correctness
  evaluation: Compare against independently annotated source evidence; preserve per-category
    error analysis
- metric: cross-level consistency
  evaluation: Compare against independently annotated source evidence; preserve per-category
    error analysis
- metric: specific uncertainty
  evaluation: Compare against independently annotated source evidence; preserve per-category
    error analysis
- metric: spoken-symbol reconstruction
  evaluation: Compare against independently annotated source evidence; preserve per-category
    error analysis
- metric: nonredundancy
  evaluation: Compare against independently annotated source evidence; preserve per-category
    error analysis
negative_cases:
- fraction ambiguity
- reversed graph axes/trends
- circuit wires crossing without junction
- flowchart branch reversal
- code > vs >=
- click Save versus observed successful save
- chemistry charge/bond ambiguity
- three-category view with unsupported cross-link
- frame unable to show temporal change
- valid JSON missing essential relationships
release_gate: TBR; explicit approval after annotated baseline; unit schema tests are
  not evidence of visual accuracy
