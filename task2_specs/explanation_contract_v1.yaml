contract_id: SYNAPSE-EXPLANATION
version: 1.0.0
status: implementation_review_candidate
source_baseline:
- Phase 1 Activity 4 v4
- Phase 1 Activity 5 five components / three levels
- Phase 1 Activity 7 grounding and uncertainty
- SRS v1.0 review candidate
principle: Enable blind/low-vision learners to reconstruct essential instructional visuals and meaning from
  spoken explanations, not merely object captions.
components:
- id: orientation
  purpose: Identify the visual subject when needed, omitting filler
- id: structure
  purpose: Describe essential elements, arrangement, topology, grouping, labels, relationships and reading
    order
- id: salient_visual_information
  purpose: Describe relevant trend, comparison, observable state, or evidence-supported change
- id: educational_meaning
  purpose: Explain visualized concepts only with visual/contextual support
- id: lecture_connection
  purpose: Link to instructor current point only when supported and useful
component_order_policy: These are flexible functions, not five compulsory paragraphs or a universally fixed
  sequence.
detail_levels:
  brief:
    objective: Immediate instructional understanding
    must: Main teaching point AND all indispensable exact visual facts and relations
    may: Omit nonessential detail, but never an indispensable symbol, grouping or connection
  standard:
    objective: Focused, sufficient essential mental model
    must: Core facts plus relevant layout, labels, units, comparisons, changes and supported context
    default: true
  detailed:
    objective: Expanded meaningful access for review
    must: All core facts from brief and standard, without contradiction
    may: Relevant secondary values, steps, structure and context
    must_not: Fill length with unsupported historical, cross-domain, or invented teacher-intent material
no_fixed_word_limits: true
category_rules:
  CT-01:
    name: Charts, graphs and quantitative plots
    required_when_relevant:
    - axes and units
    - plotted series and legend associations
    - scale and important values
    - trend and comparisons
    critical_errors:
    - reversed trend
    - fabricated scale or value
  CT-02:
    name: Mathematical and symbolic notation
    required_when_relevant:
    - exact symbols and signs
    - numerator-denominator and grouping
    - exponents, indices and bounds
    - ordered transformations
    critical_errors:
    - changed operator or sign
    - ambiguous fraction scope
  CT-03:
    name: Scientific and technical structures
    required_when_relevant:
    - labeled components
    - physical connectivity and containment
    - directions and quantities
    - supported functional relationships
    critical_errors:
    - invented junction or bond
    - reversed mechanism
  CT-04:
    name: Flowcharts, processes and networks
    required_when_relevant:
    - nodes and step order
    - decision conditions
    - labeled branches
    - loop connections and outputs
    critical_errors:
    - reversed branch
    - omitted material condition
  CT-05:
    name: Tables and matrices
    required_when_relevant:
    - headers and axes of indexing
    - row-column-cell association
    - units
    - decisive values and comparisons
    critical_errors:
    - wrong cell association
    - fabricated measurement
  CT-06:
    name: Structured instructional text
    required_when_relevant:
    - headings and hierarchy
    - sequence and list grouping
    - essential wording
    - negations and qualifiers
    critical_errors:
    - omitted negation
    - fabricated quoted text
  CT-07:
    name: Geometry and spatial constructions
    required_when_relevant:
    - points, shapes and relative position
    - angle and length markings
    - geometric relations
    - explicitly marked equalities or constraints
    critical_errors:
    - assumed scale
    - invented measurement
  CT-08:
    name: Programming and computational text
    required_when_relevant:
    - exact identifiers and operators
    - indentation and nesting
    - changed code lines
    - observed versus predicted results
    critical_errors:
    - changed operator
    - invented executed result
  CT-09:
    name: Software interfaces and operations
    required_when_relevant:
    - panel and control layout
    - selected states
    - action targets and navigation
    - observed feedback after action
    critical_errors:
    - click asserted as success
    - invented control state
  CT-10:
    name: Maps and spatial data
    required_when_relevant:
    - orientation and legend
    - region and boundary relationships
    - routes and directions
    - relevant pattern comparisons
    critical_errors:
    - reversed legend meaning
    - invented location
  CT-11:
    name: Observational images
    required_when_relevant:
    - observable entities and relative positions
    - containment and visible features
    - relevant comparisons
    - observation versus inference
    critical_errors:
    - unsupported diagnosis
    - invented mechanism
  CT-12:
    name: Instructional illustrations and physical scenes
    required_when_relevant:
    - objects and apparatus arrangement
    - action direction and sequence
    - observable changes
    - supported results
    critical_errors:
    - invented outcome
    - unsupported causal identification
mixed_category:
  multi_label: true
  requirements:
  - Preserve all material categories and scene regions
  - Record positions among regions and each region own structural relationships
  - Describe cross-region correspondences only when visibly/contextually supported
  - Preserve mathematical or technical grouping across regions
  - Never infer relationship from mere proximity
  - Keep raw and ambiguous category labels; do not force ambiguous labels into one CT ID
  - Support more than two categories and overlapping content without double-counting facts
exactness:
  mathematics:
  - signs
  - grouping
  - fractions
  - numerator/denominator
  - exponents and subscripts
  - summation/integral bounds
  - units and approximation qualifiers
  programming:
  - identifiers
  - operators such as > versus >=
  - indentation/nesting
  - punctuation where meaningful
  - observed versus predicted output
  science:
  - directions, polarities and connectivity
  - charges and bond order
  - containment and pathways
  - do not invent causes or outcomes
  temporal: When actual before/after evidence is supplied, preserve prior state, observable change and resulting
    state; a single still cannot prove a change.
evidence_policy:
  states:
  - supported
  - partially_supported
  - ambiguous_or_conflicting
  - unavailable_or_unreadable
  claim_types:
  - direct_visual_observation
  - direct_instructor_statement
  - supported_structural_relation
  - supported_educational_interpretation
  - unsupported_speculation
  rules:
  - Do not state unsupported speculation as visual fact
  - If teacher and visible evidence conflict, attribute each without silently reconciling
  - If partially supported, provide known information and specify the missing portion
  - Do not silently approximate exact signs, values, labels, connections or units
  - Avoid generic percentage confidence or boilerplate
  - Detailed level never upgrades uncertain claims to certainty
nonredundancy: If the instructor adequately conveys an essential fact, avoid redundant automatic narration;
  learner-requested review can still access it.
output_policy:
  language: English in initial release
  format: Natural intelligible spoken prose for TTS
  accessibility:
  - clear referents
  - unambiguous equations/code speech
  - meaningful spatial relationships
  - no decorative filler as a substitute for structure
  availability: Distinguish successful visual explanation from partial/unavailable visual evidence and TTS
    status
evaluation:
  required_review_dimensions:
  - essential fact recall
  - grounded claim precision
  - critical error rate
  - spatial relationship correctness
  - structural relation correctness
  - cross-category relation correctness
  - cross-level consistency
  - specific uncertainty
  - spoken-symbol reconstruction
  - nonredundancy
  thresholds: TBR; no invented numerical acceptance gates
  synthetic_regression_basis: Phase 1 Activity 8 55 examples; not real-world performance proof
change_control: Keep source baseline and explicit decisions immutable; new engineering constraints require
  reviewed semantic-version increments.
